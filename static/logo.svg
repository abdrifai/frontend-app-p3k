<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Shield Gradient Outer -->
    <linearGradient id="shieldGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="35%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <!-- Shield Inner Cyan/Blue -->
    <linearGradient id="shieldCyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="30%" stop-color="#2563eb" />
      <stop offset="70%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Ribbon / Letter S Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Golden Letter S Gradient -->
    <linearGradient id="goldS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3" />

  <!-- Shield Outer Gold Rim -->
  <path
    d="M 256 56 L 416 112 C 416 280 344 388 256 448 C 168 388 96 280 96 112 Z"
    fill="url(#shieldGold)"
    filter="url(#shadow)"
  />

  <!-- Shield Inner Blue/Cyan Core -->
  <path
    d="M 256 76 L 396 124 C 396 270 334 366 256 422 C 178 366 116 270 116 124 Z"
    fill="url(#shieldCyanBlue)"
  />

  <!-- Inner Subtle Highlights -->
  <path
    d="M 256 76 L 396 124 C 396 270 334 366 256 422 Z"
    fill="rgba(255,255,255,0.08)"
  />

  <!-- Golden Laurel Wreath Left -->
  <g fill="url(#shieldGold)" opacity="0.95">
    <path d="M 160 270 C 145 250 150 220 170 215 C 165 235 175 255 160 270 Z" />
    <path d="M 175 220 C 160 200 168 175 188 170 C 182 190 190 210 175 220 Z" />
    <path d="M 195 180 C 180 160 190 135 210 132 C 205 152 210 170 195 180 Z" />
    <path d="M 160 320 C 148 300 150 275 170 270 C 168 290 180 305 160 320 Z" />
    <path d="M 180 365 C 165 350 175 325 195 320 C 190 340 200 355 180 365 Z" />
    <path d="M 215 395 C 195 385 205 360 225 355 C 220 375 230 388 215 395 Z" />
  </g>

  <!-- Golden Laurel Wreath Right -->
  <g fill="url(#shieldGold)" opacity="0.95">
    <path d="M 352 270 C 367 250 362 220 342 215 C 347 235 337 255 352 270 Z" />
    <path d="M 337 220 C 352 200 344 175 324 170 C 330 190 322 210 337 220 Z" />
    <path d="M 317 180 C 332 160 322 135 302 132 C 307 152 302 170 317 180 Z" />
    <path d="M 352 320 C 364 300 362 275 342 270 C 344 290 332 305 352 320 Z" />
    <path d="M 332 365 C 347 350 337 325 317 320 C 322 340 312 355 332 365 Z" />
    <path d="M 297 395 C 317 385 307 360 287 355 C 292 375 282 388 297 395 Z" />
  </g>

  <!-- Flowing Ribbon (Cyan/Emerald) -->
  <path
    d="M 120 340 C 180 330 210 270 250 250 C 290 230 350 170 396 140 C 370 170 320 230 280 260 C 240 290 190 360 120 340 Z"
    fill="url(#ribbonGrad)"
    opacity="0.9"
  />

  <!-- Golden 3D Letter "S" (Iconic SIPPPK Emblem) -->
  <g filter="url(#shadow)">
    <!-- Main S Body -->
    <path
      d="M 285 165 C 325 165 345 185 340 215 C 335 245 300 260 270 275 C 235 292 215 305 210 330 C 205 358 230 375 265 375 C 295 375 320 362 335 345 L 345 372 C 325 395 292 405 255 405 C 205 405 175 378 182 335 C 188 295 228 278 258 262 C 295 245 312 235 315 215 C 318 195 300 185 275 185 C 248 185 225 198 212 212 L 202 188 C 220 170 250 165 285 165 Z"
      fill="url(#goldS)"
    />

    <!-- S Top Bevel / Highlights -->
    <path
      d="M 285 165 C 325 165 345 185 340 215 C 335 230 320 245 298 258 C 308 238 310 218 300 200 C 290 185 270 180 250 182 L 285 165 Z"
      fill="url(#shieldGold)"
      opacity="0.7"
    />
  </g>

  <!-- P3K Badge Tag Bottom Center -->
  <g transform="translate(196, 442)">
    <rect x="-10" y="0" width="140" height="34" rx="17" fill="#0f172a" stroke="url(#shieldGold)" stroke-width="2" />
    <text x="60" y="22" font-family="'Inter', sans-serif" font-weight="900" font-size="16" fill="#fef08a" text-anchor="middle" letter-spacing="3">
      SIPPPK
    </text>
  </g>
</svg>